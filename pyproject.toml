[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silverestimate"
dynamic = ["version"]
description = "A desktop application for managing silver sales estimates with encrypted data storage"
readme = "readme.md"
requires-python = ">=3.14,<3.15"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    {name = "Silver Estimation App", email = "noreply@silverestimate.app"}
]
keywords = [
    "silver",
    "estimation",
    "inventory",
    "pyside6",
    "qt6",
    "sqlcipher",
    "windows",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Office/Business",
]

dependencies = [
    "PySide6>=6.11.2,<6.12",
    "argon2-cffi>=25.1.0,<26",
    "apsw-sqlite3mc>=3.53.4.0,<4",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=9.1.1",
    "pytest-qt>=4.5.0",
    "hypothesis>=6.167.1",
    # Code Quality
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "nox>=2026.8.17",
    # Development tools
    "Nuitka==4.2.1",
    "zstandard==0.25.0",
    "pip-audit>=2.10.1,<3",
]

[project.urls]
Homepage = "https://github.com/kta136/Silver_estimate"
Documentation = "https://github.com/kta136/Silver_estimate/tree/main/DOCS"
Repository = "https://github.com/kta136/Silver_estimate"
"Bug Tracker" = "https://github.com/kta136/Silver_estimate/issues"

[tool.setuptools.dynamic]
version = {attr = "silverestimate.infrastructure.app_constants.APP_VERSION"}

[tool.setuptools.packages.find]
where = ["."]
include = ["silverestimate*"]
exclude = ["tests*", "scripts*", "build*", "dist*"]

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [
    ".git",
    ".mypy_cache",
    ".pytest_cache",
    ".venv",
    "build",
    "dist",
    "__pycache__",
]

[tool.ruff.lint]
select = [
    "E9",
    "F",
    "I",
    "B",
    "SIM",
    "PERF",
    "S",
]
# `assert` narrows types in application code.
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/ui/test_estimate_entry_integration.py" = ["F841"]
"tests/**/*.py" = ["S"]
"scripts/**/*.py" = ["S"]
"main.py" = ["S"]
"noxfile.py" = ["S"]
"silverestimate/ui/models/*.py" = ["B008"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false  # Set to true once type hints are added
disallow_incomplete_defs = false  # Set to true once type hints are added
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true
show_error_codes = true
disable_error_code = ["union-attr"]
exclude = [
    "^build/",
    "^dist/",
    "^tests/",
]

[[tool.mypy.overrides]]
module = [
    "silverestimate.domain.estimate_models",
    "silverestimate.domain.item_validation",
    "silverestimate.infrastructure.app_constants",
    "silverestimate.infrastructure.paths",
    "silverestimate.infrastructure.settings",
    "silverestimate.persistence.apsw_dbapi",
    "silverestimate.persistence.database_driver",
    "silverestimate.persistence.storage_metadata",
    "silverestimate.persistence.items_repository",
    "silverestimate.security.encryption",
    "silverestimate.security.credential_store",
    "silverestimate.security.windows_vault",
    "silverestimate.services.estimate_calculator",
    "silverestimate.persistence.schema",
    "silverestimate.presenter.estimate_entry_presenter",
    "silverestimate.infrastructure.application",
    "silverestimate.ui.estimate_entry_components.primary_actions_bar",
    "silverestimate.ui.estimate_entry_components.secondary_actions_bar",
    "silverestimate.ui.estimate_entry_logic.constants",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = [
    "silverestimate.domain.pagination",
    "silverestimate.infrastructure.latest_request_runner",
    "silverestimate.persistence.silver_bar_command_repository",
    "silverestimate.persistence.silver_bar_query_repository",
    "silverestimate.persistence.repository_results",
    "silverestimate.persistence.silver_bar_synchronization_repository",
    "silverestimate.services.dda_rate_fetcher",
    "silverestimate.services.dda_rate_stream",
    "silverestimate.ui.print_format_spec",
    "silverestimate.ui.settings_live_rates_page",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
qt_api = "pyside6"
addopts = [
    "--verbose",
    "--capture=no",
    "--strict-markers",
    "--strict-config",
]
markers = [
    "smoke: marks opt-in smoke tests that exercise full application startup",
]
filterwarnings = ["error"]

[[tool.mypy.overrides]]
module = [
    "silverestimate.domain.estimate_entry",
    "silverestimate.services.estimate_entry_persistence",
    "silverestimate.ui.estimate_entry",
    "silverestimate.ui.estimate_entry_layout_controller",
    "silverestimate.ui.estimate_entry_table_controller",
    "silverestimate.ui.estimate_entry_totals_controller",
    "silverestimate.ui.estimate_entry_workflow_controller",
    "silverestimate.ui.estimate_draft_recovery",
]
enable_error_code = ["union-attr"]


[[tool.mypy.overrides]]
module = [
    "silverestimate.ui.silver_bar_management",
    "silverestimate.ui.silver_bar_management_ui",
    "silverestimate.ui.silver_bar_load_controller",
    "silverestimate.ui.silver_bar_list_print_controller",
    "silverestimate.ui.silver_bar_optimization_controller",
]
enable_error_code = ["union-attr"]


[[tool.mypy.overrides]]
module = ["silverestimate.ui.preview_build_worker"]
enable_error_code = ["union-attr"]
disallow_untyped_defs = true
